[workspace]
members = [
    "crates/roost-core",
    "crates/roost-store",
    "crates/roost-ipc",
    "crates/roost-process",
    "crates/roost-daemon",
    "crates/roost-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
roost-core = { path = "crates/roost-core" }
roost-store = { path = "crates/roost-store" }
roost-ipc = { path = "crates/roost-ipc" }
roost-process = { path = "crates/roost-process" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
